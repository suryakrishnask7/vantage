<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vantage</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dark-bg">

<div class="container py-4">

  <h1 class="text-center title mb-4">Vantage - Habit Tracker</h1>

  <!-- Month Tabs -->
  <ul class="nav nav-pills justify-content-center mb-4" id="monthTabs"></ul>

  <!-- Monthly Goal -->
  <div class="card dark-card mb-4">
    <div class="card-body d-flex align-items-center gap-3">
      <input type="checkbox" id="goalCheck" class="form-check-input">
      <input type="text" id="goalText"
             class="form-control form-control-sm bg-dark text-light border-secondary"
             placeholder="Monthly goal (editable)">
    </div>
  </div>

  <!-- Weekly Tracker -->
  <div class="card dark-card mb-4">
    <div class="card-body">
      <h6 class="muted mb-3">Weekly Checkpoints (Saturdays)</h6>
      <div id="weeklyTracker" class="weekly-grid"></div>
    </div>
  </div>

<!-- Habit Controls -->
<div class="d-flex justify-content-center gap-2 mb-3 flex-wrap align-items-center">

  <button class="btn btn-outline-success btn-sm" id="addHabit">Add Habit</button>
  <button class="btn btn-outline-danger btn-sm" id="removeHabit">Remove Habit</button>

  <select id="copyFromMonth"
          class="form-select form-select-sm bg-dark text-light border-secondary"
          style="width: 140px;">
  </select>

  <button class="btn btn-outline-primary btn-sm" id="copyHabits">
    Copy Habits
  </button>

  <button class="btn btn-outline-info btn-sm" id="exportJSON">Export JSON</button>

  <label class="btn btn-outline-warning btn-sm mb-0">
    Import JSON
    <input type="file" id="importJSON" accept=".json" hidden>
  </label>

</div>


  <!-- Habit Table -->
  <div class="card dark-card mb-4">
    <div class="card-body table-responsive">
      <table class="table table-dark table-borderless text-center align-middle">
        <thead id="tableHead"></thead>
        <tbody id="habitTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Chart -->
  <div class="card dark-card">
    <div class="card-body">
      <h6 class="text-center muted mb-3">Daily Habit Completion</h6>
      <canvas id="habitChart"></canvas>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
