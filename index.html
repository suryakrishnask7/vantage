<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yearly Habit Tracker</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="dark-bg">

<div class="container-fluid py-4">

  <h1 class="text-center title mb-4">Yearly Habit Tracker</h1>

  <!-- Month Tabs -->
  <ul class="nav nav-pills justify-content-center mb-4" id="monthTabs"></ul>

  <!-- Habit Controls -->
  <div class="d-flex justify-content-center gap-2 mb-4">
    <button class="btn btn-outline-success btn-sm" id="addHabit">➕ Add Habit</button>
    <button class="btn btn-outline-danger btn-sm" id="removeHabit">➖ Remove Habit</button>
  </div>

  <!-- Table -->
  <div class="card dark-card mb-5">
    <div class="card-body table-responsive">
      <table class="table table-dark table-borderless text-center align-middle">
        <thead id="tableHead"></thead>
        <tbody id="habitTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Chart -->
  <div class="card dark-card">
    <div class="card-body">
      <h5 class="text-center muted mb-3">Monthly Progress</h5>
      <canvas id="habitChart"></canvas>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
